schema_version: 1
environment: synthetic-pve-delete
components:
  pve:
    inputs:
      cluster: ./cluster.yml
      vms: ./vms.yml
    files:
      backend: ./backend.json
      state_admission: ./state-admission.json
      execution_admission: ./execution-admission.json
      ssh_key: ./ssh_key.example
      known_hosts: ./known_hosts.example
      root_main: ./verification-root/main.tf
      root_provider: ./verification-root/main.tf.json
      root_variables: ./verification-root/variables.tf
      root_outputs: ./verification-root/outputs.tf
      root_lock: ./verification-root/.terraform.lock.hcl
    options:
      root:
        id: synthetic-delete-root
        directory: .
        files:
          main.tf: root_main
          main.tf.json: root_provider
          variables.tf: root_variables
          outputs.tf: root_outputs
          .terraform.lock.hcl: root_lock
      pve:
        storage_id: synthetic-images
        ssh_host: synthetic-node.example.invalid
        ssh_user: pve-ops
        ssh_port: 2222
        api_endpoint: https://pve.example.invalid:8006
        insecure: false
      destroy: true
