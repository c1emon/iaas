[project]
name = "iaas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "passlib>=1.7.4",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ansible>=13.7.0",
    "ansible-lint>=26.4.0",
    "httpx>=0.28.1",
    "paramiko>=3.5.1",
    "pytest>=8.3.0",
    "yamllint>=1.38.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ansible/tests", "scripts/tests"]
norecursedirs = ["ansible/collections"]
