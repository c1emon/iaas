[project]
name = "iaas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "passlib>=1.7.4",
    "proxmoxer>=2.3.0",
    "pydantic>=2.13.5,<3",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
]

[dependency-groups]
runtime = [
    "ansible-core==2.21.4",
    "boto3>=1.35,<2",
    "httpx==0.28.1",
    "paramiko==5.0.0",
    "python-hcl2>=8,<9",
]
dev = [
    "ansible==14.4.0",
    "ansible-lint>=26.8.0",
    "boto3>=1.35,<2",
    "httpx>=0.28.1",
    "hypothesis>=6.168.0",
    "import-linter>=2.15",
    "paramiko>=3.5.1",
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "python-hcl2>=8,<9",
    "ruff>=0.16.8",
    "yamllint>=1.38.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".*", "automation/ansible/collections"]
addopts = "--strict-markers"
markers = [
    "fast: bounded pure offline tests with no external tool or infrastructure dependency",
    "integration: local tool integration using synthetic inputs and temporary paths",
]

[tool.importlinter]
root_package = "iaas"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Common primitives stay independent"
type = "forbidden"
source_modules = ["iaas.common"]
forbidden_modules = ["iaas.http_transport", "iaas.opnsense_workflow", "iaas.opnsense_diagnostics", "iaas.opnsense_validation", "iaas.pve_inventory", "iaas.k3s_automation", "iaas.runtime_execution", "requests", "httpx", "proxmoxer"]

[[tool.importlinter.contracts]]
name = "OPNsense conversion stays pure"
type = "forbidden"
source_modules = ["iaas.opnsense_workflow.conversion"]
forbidden_modules = ["iaas.http_transport", "iaas.opnsense_workflow.reader", "iaas.opnsense_workflow.executor", "iaas.opnsense_workflow.planning", "iaas.runtime_execution", "requests", "httpx", "proxmoxer"]

[[tool.importlinter.contracts]]
name = "Offline OPNsense admission stays offline"
type = "forbidden"
source_modules = ["iaas.opnsense_validation"]
forbidden_modules = ["iaas.http_transport", "iaas.opnsense_workflow", "iaas.opnsense_diagnostics", "iaas.runtime_execution", "requests", "httpx", "proxmoxer"]

[[tool.importlinter.contracts]]
name = "HTTP transport stays independent of domains"
type = "forbidden"
source_modules = ["iaas.http_transport"]
forbidden_modules = ["iaas.opnsense_workflow", "iaas.opnsense_diagnostics", "iaas.opnsense_validation", "iaas.pve_inventory", "iaas.k3s_automation", "iaas.runtime_execution"]

[tool.ruff]
target-version = "py312"
include = [
    "src/iaas/common/conversion.py",
    "src/iaas/common/errors.py",
    "src/iaas/opnsense_workflow/conversion/*.py",
    "src/iaas/http_transport/*.py",
    "tests/python/test_opnsense_conversion.py",
    "tests/python/test_import_contracts.py",
    "tests/python/test_http_transport.py",
    "tests/python/test_http_read_adapters.py",
    "tests/python/test_safe_diagnostics.py",
]
extend-exclude = ["automation/ansible/collections", "**/generated/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
