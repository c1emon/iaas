[project]
name = "iaas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "passlib>=1.7.4",
    "proxmoxer>=2.3.0",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ansible>=14.3.1",
    "ansible-lint>=26.8.0",
    "httpx>=0.28.1",
    "paramiko>=3.5.1",
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "yamllint>=1.38.0",
]

[tool.pytest.ini_options]
pythonpath = ["automation/src"]
testpaths = ["tests"]
norecursedirs = ["automation/ansible/collections"]
