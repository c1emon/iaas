[project]
name = "iaas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "passlib>=1.7.4",
    "proxmoxer>=2.3.0",
    "pydantic>=2.13.5,<3",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
]

[dependency-groups]
runtime = [
    "ansible-core==2.21.4",
    "httpx==0.28.1",
    "paramiko==5.0.0",
]
dev = [
    "ansible==14.4.0",
    "ansible-lint>=26.8.0",
    "httpx>=0.28.1",
    "hypothesis>=6.168.0",
    "import-linter>=2.15",
    "paramiko>=3.5.1",
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "yamllint>=1.38.0",
]

[tool.pytest.ini_options]
pythonpath = ["automation/src"]
testpaths = ["tests"]
norecursedirs = [".*", "automation/ansible/collections"]

[tool.importlinter]
root_package = "iaas_automation"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Common primitives stay independent"
type = "forbidden"
source_modules = ["iaas_automation.common"]
forbidden_modules = ["iaas_automation.opnsense_workflow", "iaas_automation.opnsense_diagnostics", "iaas_automation.opnsense_validation", "iaas_automation.pve_inventory", "iaas_automation.k3s_automation", "iaas_automation.runtime_execution", "requests", "httpx", "proxmoxer"]

[[tool.importlinter.contracts]]
name = "OPNsense conversion stays pure"
type = "forbidden"
source_modules = ["iaas_automation.opnsense_workflow.conversion"]
forbidden_modules = ["iaas_automation.opnsense_workflow.reader", "iaas_automation.opnsense_workflow.executor", "iaas_automation.opnsense_workflow.planning", "iaas_automation.runtime_execution", "requests", "httpx", "proxmoxer"]

[[tool.importlinter.contracts]]
name = "Offline OPNsense admission stays offline"
type = "forbidden"
source_modules = ["iaas_automation.opnsense_validation"]
forbidden_modules = ["iaas_automation.opnsense_workflow", "iaas_automation.opnsense_diagnostics", "iaas_automation.runtime_execution", "requests", "httpx", "proxmoxer"]
