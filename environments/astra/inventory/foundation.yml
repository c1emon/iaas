---
# Foundation recovery source of truth. Safe, read-only metadata only.
schema_version: 1

foundation_hosts:
  - name: opnsense
    kind: appliance
    management_identity: https://10.1.0.254
    notes: Core router and firewall.

  - name: truenas
    kind: appliance
    management_identity: 10.1.0.210
    extra_addresses:
      - 10.33.0.210
      - 10.50.0.210
    notes: TrueNAS SCALE storage and data services.

  - name: n100
    kind: bare-metal
    management_identity: 10.1.0.15
    extra_addresses:
      - 10.50.0.15
    accepted_spof: true
    notes: Docker host for Authentik, Harbor, SmartDNS, Postfix, and Traefik.

  - name: rk3588
    kind: bare-metal
    management_identity: 10.1.0.253
    extra_addresses:
      - 10.40.0.253
    notes: sing-box proxy gateway node.

  - name: external-databases
    kind: external-dependency
    management_identity: external dedicated database hosts / provider
    notes: External database hosts outside repository control.

foundation_services:
  - name: opnsense
    host: opnsense
    runtime: appliance
    tier: critical
    required_before_k3s: true
    restore_order: 1
    dependencies: []
    health_check:
      type: http
      target: https://10.1.0.254
      expected_status: [200, 302, 401]
    backup_restore:
      profile: opnsense-config
      restore_runbook: docs/operations/02-opnsense.md
    break_glass:
      method: local-console
      access_path: UI + physical console
      secret_ref: op://foundation/opnsense/local-admin
    known_risks:
      - accepted single point of failure for gateway and firewall.

  - name: truenas
    host: truenas
    runtime: appliance
    tier: critical
    required_before_k3s: true
    restore_order: 2
    dependencies: [opnsense]
    health_check:
      type: api
      target: https://10.1.0.210/api/v2.0.0/system/info
      expected_status: [200]
    backup_restore:
      profile: truenas-config
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-console
      access_path: UI + physical console
      secret_ref: op://foundation/truenas/local-admin

  - name: internal-dns
    host: n100
    runtime: compose
    tier: critical
    required_before_k3s: true
    restore_order: 3
    dependencies: [opnsense]
    health_check:
      type: dns
      target: clemon.cis
      resolver: 10.50.0.15
      record_type: a
      expected_answer: 10.50.0.15
    backup_restore:
      profile: smartdns-config
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-admin
      access_path: SSH + console
      secret_ref: op://foundation/smartdns/admin

  - name: sing-box
    host: rk3588
    runtime: systemd
    tier: critical
    required_before_k3s: true
    restore_order: 4
    dependencies: [opnsense, internal-dns]
    health_check:
      type: tcp
      target: 10.40.0.253:1080
    backup_restore:
      profile: sing-box-config
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-admin
      access_path: SSH + console
      secret_ref: op://foundation/sing-box/admin

  - name: harbor
    host: n100
    runtime: compose
    tier: critical
    required_before_k3s: true
    restore_order: 5
    dependencies: [internal-dns, truenas]
    health_check:
      type: https
      target: https://10.50.0.15
      expected_status: [200, 302, 401]
    backup_restore:
      profile: harbor-data
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-admin
      access_path: UI + SSH
      secret_ref: op://foundation/harbor/admin

  - name: external-databases
    host: external-databases
    external_dependency: true
    runtime: external
    tier: critical
    required_before_k3s: true
    restore_order: 6
    dependencies: [opnsense, internal-dns]
    health_check:
      type: tcp
      target: external-db.example.invalid:5432
    backup_restore:
      profile: external-database
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: provider-console
      access_path: ticketed support / local admin
      secret_ref: ref:provider-managed

  - name: authentik
    host: n100
    runtime: compose
    tier: important
    required_before_k3s: false
    dependencies: [internal-dns]
    health_check:
      type: https
      target: https://10.50.0.15
      expected_status: [200, 302, 401]
    backup_restore:
      profile: authentik-config
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-admin
      access_path: UI + console
      secret_ref: op://foundation/authentik/admin

storage_networks:
  - name: storage-vlan
    vlan_id: 33
    subnet: 10.33.0.0/24
    truenas_endpoint: 10.33.0.210
    notes: PVE ↔ TrueNAS storage network.

k3s_storage_access:
  phase_1:
    node_classes: [vm]
    storage_networks: [storage-vlan]
    notes: Only VM-based K3s nodes may access the storage VLAN in the first phase.
