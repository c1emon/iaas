---
# Synthetic regression data; not a deployment environment.
schema_version: 2
foundation_hosts:
  - name: opnsense
    kind: appliance
    management_identity: https://192.0.2.254
    notes: Core router and firewall.
  - name: truenas
    kind: appliance
    management_identity: 192.0.2.210
    extra_addresses:
      - 198.18.0.210
      - 203.0.113.210
    notes: TrueNAS SCALE storage and data services.
  - name: foundation-a
    kind: bare-metal
    management_identity: 192.0.2.15
    extra_addresses:
      - 203.0.113.15
    accepted_spof: true
    notes: Docker host for Authentik, Harbor, SmartDNS, Postfix, and Traefik.
  - name: rk3588
    kind: bare-metal
    management_identity: 192.0.2.253
    extra_addresses:
      - 198.19.0.253
    notes: sing-box proxy gateway node.
  - name: external-database-hosts
    kind: external-dependency
    management_identity: external dedicated database hosts / provider
    notes: External database hosts outside repository control.
foundation_services:
  - name: opnsense
    host: opnsense
    runtime: appliance
    tier: critical
    required_before_k3s: true
    restore_order: 1
    dependencies: []
    health_check:
      type: http
      target: https://192.0.2.254
      expected_status:
        - 200
        - 302
        - 401
    backup_restore:
      profile: opnsense-config
      restore_runbook: docs/operations/02-opnsense.md
    break_glass:
      method: local-console
      access_path: UI + physical console
      secret_ref: op://foundation/opnsense/local-admin
    known_risks:
      - accepted single point of failure for gateway and firewall.
  - name: truenas
    host: truenas
    runtime: appliance
    tier: critical
    required_before_k3s: true
    restore_order: 2
    dependencies:
      - opnsense
    health_check:
      type: api
      target: https://192.0.2.210/api/v2.0.0/system/info
      expected_status:
        - 200
    backup_restore:
      profile: truenas-config
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-console
      access_path: UI + physical console
      secret_ref: op://foundation/truenas/local-admin
  - name: internal-dns
    host: foundation-a
    runtime: compose
    tier: critical
    required_before_k3s: true
    restore_order: 3
    dependencies:
      - opnsense
    health_check:
      type: dns
      target: internal.example.invalid
      resolver: 203.0.113.15
      record_type: a
      expected_answer: 203.0.113.15
    backup_restore:
      profile: smartdns-config
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-admin
      access_path: SSH + console
      secret_ref: op://foundation/smartdns/admin
  - name: sing-box
    host: rk3588
    runtime: systemd
    tier: critical
    required_before_k3s: true
    restore_order: 4
    dependencies:
      - opnsense
      - internal-dns
    health_check:
      type: tcp
      target: 198.19.0.253:1080
    backup_restore:
      profile: sing-box-config
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-admin
      access_path: SSH + console
      secret_ref: op://foundation/sing-box/admin
  - name: harbor
    host: foundation-a
    runtime: compose
    tier: critical
    required_before_k3s: true
    restore_order: 5
    dependencies:
      - internal-dns
      - truenas
    health_check:
      type: https
      target: https://203.0.113.15
      expected_status:
        - 200
        - 302
        - 401
    backup_restore:
      profile: harbor-data
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-admin
      access_path: UI + SSH
      secret_ref: op://foundation/harbor/admin
  - name: external-databases
    host: external-database-hosts
    external_dependency: true
    runtime: external
    tier: critical
    required_before_k3s: true
    restore_order: 6
    dependencies:
      - opnsense
      - internal-dns
    health_check:
      type: tcp
      target: external-db.example.invalid:5432
    backup_restore:
      profile: external-database
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: provider-console
      access_path: ticketed support / local admin
      secret_ref: ref:provider-managed
  - name: authentik
    host: foundation-a
    runtime: compose
    tier: important
    required_before_k3s: false
    dependencies:
      - internal-dns
    health_check:
      type: https
      target: https://203.0.113.15
      expected_status:
        - 200
        - 302
        - 401
    backup_restore:
      profile: authentik-config
      restore_runbook: docs/operations/06-acceptance-and-recovery.md
    break_glass:
      method: local-admin
      access_path: UI + console
      secret_ref: op://foundation/authentik/admin
storage_networks:
  - name: storage-vlan
    vlan_id: 33
    subnet: 198.18.0.0/24
    endpoint: 198.18.0.210
    notes: PVE ↔ TrueNAS storage network.
storage_access:
  node_classes:
    - vm
  storage_networks:
    - storage-vlan
  notes: Declared storage access for this example's VM nodes.
