---
# Hand-written desired state for additive OPNsense PBR gateway management.
#
# This file is intentionally empty by default. Add reviewed PBR gateways to
# opnsense_gateways before running manage-gateways.yml. Exported files under
# exports/opnsense/ are observed live state and are not read by the apply
# workflow.
#
# The interface field must use the OPNsense interface identifier / network port
# value accepted by the gateway API, not the UI display name. Examples: lan,
# wan, opt1, opt2. Custom UI names such as LAN, MGMT, DMZ, or LAN_A are not
# resolved here.
#
# Example entry shape for a FakeIP PBR proxy next-hop:
# opnsense_gateways:
#   - name: GW_PROXY
#     interface: opt1
#     ip_protocol: inet
#     gateway: 10.40.0.253
#     default_gw: false
#     far_gw: false
#     monitor_disable: true
#     monitor_noroute: false
#     monitor: 10.40.0.253
#     force_down: false
#     latency_low: 200
#     latency_high: 500
#     loss_low: 10
#     loss_high: 20
#     interval: 1
#     time_period: 60
#     loss_interval: 4
#     data_length: 1
#     priority: 255
#     weight: 1
#     description: Proxy gateway for FakeIP policy-based routing
#     state: present
#   - name: OLD_GW_PROXY
#     interface: opt1
#     ip_protocol: inet
#     gateway: 10.40.0.252
#     default_gw: false
#     far_gw: false
#     monitor_disable: true
#     monitor_noroute: false
#     monitor: 10.40.0.252
#     force_down: false
#     latency_low: 200
#     latency_high: 500
#     loss_low: 10
#     loss_high: 20
#     interval: 1
#     time_period: 60
#     loss_interval: 4
#     data_length: 1
#     priority: 255
#     weight: 1
#     description: Retired proxy gateway explicitly removed from Git
#     state: absent
opnsense_gateways:
    - name: HOLE
      interface: opt8
      ip_protocol: inet
      gateway: 10.40.0.253
      default_gw: false
      far_gw: false
      monitor_disable: false
      monitor_noroute: false
      monitor: 10.40.0.253
      force_down: false
      latency_low: 200
      latency_high: 500
      loss_low: 10
      loss_high: 20
      interval: 1
      time_period: 60
      loss_interval: 4
      data_length: 1
      priority: 255
      weight: 1
      description: Proxy gateway for FakeIP policy-based routing
      state: present
