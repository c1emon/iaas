---
# Hand-written desired state for additive OPNsense firewall alias management.
#
# This file is intentionally empty by default. Add reviewed aliases to
# opnsense_aliases before running manage-aliases.yml. Exported files under
# exports/opnsense/ are observed live state and are not read by the apply
# workflow.
#
# Example entry shape:
# opnsense_aliases:
#   - name: EXAMPLE_HOSTS
#     type: host
#     content:
#       - 192.0.2.10
#       - 192.0.2.11
#     description: Example hosts managed from Git
#     enabled: true
#     state: present
opnsense_aliases:
  - name: HOLE_GATEWAY
    type: host
    content:
      - 10.40.0.253
    description: Hole's gateway address
    enabled: true
    state: present
  - name: HOLE_PORTS
    type: port
    content:
      - 53
      - 7890
    description: Hole's dns and http/socks proxy port
    enabled: true
    state: present
  - name: FAKEIP_NETS
    type: network
    content:
      - 198.18.0.10/15
      - fc00::/18
    description: Hole's fake IP networks
    enabled: true
    state: present
