---
# Hand-written desired state for additive OPNsense new firewall filter rule management.
#
# This file is intentionally empty by default. Add reviewed API-backed Rules [new]
# entries to opnsense_filter_rules before running manage-filter-rules.yml.
#
# Do not generate this file from download_rules.csv or raw artifacts under
# exports/opnsense/. Those files are migration/review inputs only and are not
# read by the apply workflow.
#
# scope and slug are immutable identity parts. This workflow generates the
# OPNsense description as iaas:opnsense:filter:<scope>:<slug> and uses
# match_fields: ['description']. Do not declare description directly in
# opnsense_filter_rules; direct description input is rejected.
#
# sequence controls rule order, but is not part of rule identity. Recommended
# sequence blocks:
#   1-99: essential allow/block rules
#   100-199: selective gateway or routing-policy rules
#   200-499: special allow/block rules
#   900+: broad default allow rules
#
# source_net and destination_net accept either a string or a YAML list. Lists
# are normalized to comma-separated strings before rule_multi is called. Port
# fields remain strings so ranges like 21115-21117 are not confused with lists.
# source_invert and destination_invert may be omitted when false. Declare them
# only when inverted matching is needed, or when an explicit true/false override
# helps review.
# source_port and destination_port may be omitted when unrestricted. They accept
# a string or YAML list of port numbers, port aliases, or ranges. Lists are
# normalized to comma-separated strings before rule_multi is called.
#
# Example entries:
# opnsense_filter_rules:
#   - scope: lan
#     slug: allow-dns-to-hole
#     state: present
#     enabled: true
#     sequence: 100
#     interface:
#       - lan
#     direction: in
#     action: pass
#     quick: true
#     ip_protocol: inet46
#     protocol: TCP/UDP
#     source_net: any
#     destination_net:
#       - HOLE_VIPS
#     destination_port:
#       - "53"
#       - 21115-21117
#       - HOLE_PORTS
#     gateway: ""
#   - scope: lan
#     slug: remove-old-example
#     state: absent
#     enabled: false
#     sequence: 900
#     interface:
#       - lan
#     direction: in
#     action: pass
#     quick: true
#     ip_protocol: inet
#     protocol: any
#     source_net: any
#     destination_net: any
