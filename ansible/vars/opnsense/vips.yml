---
# Hand-written desired state for additive OPNsense IP Alias Virtual IP management.
#
# This file is intentionally empty by default. Add reviewed IP Alias VIPs to
# opnsense_vips before running manage-vips.yml. Exported files under
# exports/opnsense/ are observed live state and are not read by the apply
# workflow.
#
# The interface field must use the OPNsense interface identifier / network port
# value accepted by the VIP API, not the UI display name. Examples: lan, wan,
# opt1, opt2. Custom UI names such as LAN or MGMT are not resolved here.
#
# Example entry shape:
# opnsense_vips:
#   - description: Example web service VIP managed from Git
#     interface: lan
#     address: 192.0.2.20/24
#     bind: true
#     expand: true
#     state: present
#   - description: Retired service VIP explicitly removed from Git
#     interface: lan
#     address: 192.0.2.21/24
#     bind: true
#     expand: true
#     state: absent
opnsense_vips:
    - description: Hole VIP for MGMT
      interface: opt1
      address: 10.1.0.253/32
      bind: false
      expand: true
      state: present
    - description: Hole VIP for DEV
      interface: opt2
      address: 10.10.0.253/32
      bind: false
      expand: true
      state: present
    - description: Hole VIP for APP
      interface: opt4
      address: 10.50.0.253/32
      bind: false
      expand: true
      state: present
    - description: Hole VIP for LAN
      interface: lan
      address: 192.168.99.253/32
      bind: false
      expand: true
      state: present
