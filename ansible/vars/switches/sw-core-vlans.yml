---
# Hand-written desired state for additive SKS8300 VLAN configuration management.
#
# This file is intentionally plan-only by default through
# playbooks/switches/config-plan.yml (`switch_config_apply: false`). Review the
# generated plan before setting `switch_config_apply=true`.
#
# The switch_config role supports declarative VLAN and interface resources. Do
# not place raw CLI commands here; arbitrary command lists are rejected by the
# workflow.
#
# Example entry shape:
# switch_config_intent:
#   vlans:
#     - id: 3999
#       name: ansible-test
#       state: present
#     - id: 3998
#       state: absent
#   interfaces:
#     - name: Ethernet1/0/48
#       mode: access
#       access_vlan: 3999
#     - name: Ethernet1/0/47
#       mode: trunk
#       tagged_vlans: [10, 20, 3999]
#     - name: Ethernet1/0/46
#       mode: hybrid
#       tagged_vlans: [20, 3999]
#       untagged_vlans: [10]
switch_config_intent:
  vlans: []
  interfaces: []
