---
- name: Placeholder for OPNsense DNAT management
  hosts: opnsense
  gather_facts: false
  connection: local

  vars:
    opnsense_dnat_source: "{{ ansible_project_dir }}/vars/opnsense/dnat.yml"

  tasks:
    - name: Load desired OPNsense DNAT placeholder data
      ansible.builtin.include_vars:
        file: "{{ opnsense_dnat_source }}"

    - name: Assert desired DNAT placeholder data is a sequence
      ansible.builtin.assert:
        that:
          - opnsense_dnat_rules is defined
          - opnsense_dnat_rules is sequence
          - opnsense_dnat_rules is not string
        fail_msg: >-
          opnsense_dnat_rules must be defined as a YAML sequence in
          vars/opnsense/dnat.yml.

    - name: Stop because OPNsense DNAT management is not implemented
      ansible.builtin.fail:
        msg: >-
          OPNsense DNAT management is intentionally not implemented yet. The
          oxlorg.opnsense collection used by this repository does not currently
          provide a stable dedicated Destination NAT / port-forward module, so
          this placeholder performs no API writes. Keep desired DNAT notes in
          vars/opnsense/dnat.yml for review only, or create a separate reviewed
          change if a raw API workaround or native module support is introduced.
