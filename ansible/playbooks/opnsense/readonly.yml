---
- name: Read-only OPNsense API smoke test
  hosts: opnsense
  gather_facts: false
  connection: local

  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_api_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"

  tasks:
    - name: Run OPNsense API credential preflight
      ansible.builtin.import_tasks: tasks/api-credential-preflight.yml

    - name: List configured firewall aliases without changing OPNsense
      oxlorg.opnsense.list:
        firewall: "{{ opnsense_api_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        ssl_verify: "{{ opnsense_ssl_verify }}"
        target: alias
      register: opnsense_aliases

    - name: Show alias query result
      ansible.builtin.debug:
        var: opnsense_aliases
