---
- name: Create OPNsense configuration snapshot
  hosts: opnsense
  gather_facts: false
  connection: local

  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_api_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"

  tasks:
    - name: Run OPNsense API credential preflight
      ansible.builtin.import_tasks: tasks/api-credential-preflight.yml

    - name: Create configuration snapshot before managed changes
      oxlorg.opnsense.snapshot:
        firewall: "{{ opnsense_api_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        ssl_verify: "{{ opnsense_ssl_verify }}"
        name: "ansible-pre-change"
      register: opnsense_snapshot

    - name: Show snapshot result
      ansible.builtin.debug:
        var: opnsense_snapshot
