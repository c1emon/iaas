---
- name: Verify PVE guest reachability and identity
  hosts: localhost
  gather_facts: false

  vars:
    pve_guest_group: pve_vms
    pve_guest_results: []

  tasks:
    - name: Load generated guest targets
      ansible.builtin.set_fact:
        pve_guest_names: "{{ groups.get(pve_guest_group, []) }}"
      changed_when: false

    - name: Report SKIP when no guests are declared
      ansible.builtin.debug:
        msg: >-
          SKIP inventory.{{ pve_guest_group }}: no declared guests found in the generated inventory;
          summary: 0 pass, 0 warn, 0 fail, 0 skip
      when: pve_guest_names | length == 0
      changed_when: false

    - name: End play when no guests are declared
      ansible.builtin.meta: end_play
      when: pve_guest_names | length == 0

    - name: Verify each generated guest
      ansible.builtin.include_tasks: tasks/verify-guest.yml
      loop: "{{ pve_guest_names }}"
      loop_control:
        loop_var: pve_guest_name
        label: "{{ pve_guest_name }}"

    - name: Build the operator report
      ansible.builtin.set_fact:
        pve_guest_pass_count: "{{ pve_guest_results | selectattr('severity', 'equalto', 'PASS') | list | length }}"
        pve_guest_warn_count: "{{ pve_guest_results | selectattr('severity', 'equalto', 'WARN') | list | length }}"
        pve_guest_fail_count: "{{ pve_guest_results | selectattr('severity', 'equalto', 'FAIL') | list | length }}"
        pve_guest_skip_count: "{{ pve_guest_results | selectattr('severity', 'equalto', 'SKIP') | list | length }}"
      changed_when: false

    - name: Render the operator report
      ansible.builtin.set_fact:
        pve_guest_report: |-
          {% for result in pve_guest_results %}
          {{ result.line }}
          {% endfor %}
          summary: {{ pve_guest_pass_count }} pass, {{ pve_guest_warn_count }} warn, {{ pve_guest_fail_count }} fail, {{ pve_guest_skip_count }} skip
      changed_when: false

    - name: Print the verification summary
      ansible.builtin.debug:
        msg: "{{ pve_guest_report }}"
      changed_when: false

    - name: Fail when hard failures exist
      ansible.builtin.fail:
        msg: >-
          PVE guest verification found {{ pve_guest_fail_count }} hard failure(s)
      when: pve_guest_fail_count | int > 0
