---
- name: Bootstrap PVE guests
  hosts: pve_vms
  become: true
  become_method: ansible.builtin.sudo
  gather_facts: true

  roles:
    - role: vm_baseline
      vars:
        vm_baseline_connection_nic: >-
          {{ (pve_nics | default([]) | selectattr('ansible_connection', 'equalto', true) | list | first | default({})) }}
        vm_baseline_network_gateway: >-
          {{ vm_baseline_connection_nic.get('gateway', '') }}
        vm_baseline_network_dns: >-
          {{ vm_baseline_connection_nic.get('dns', []) }}
