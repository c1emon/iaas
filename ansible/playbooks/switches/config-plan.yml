---
- name: Plan SKS8300 declarative switch configuration
  hosts: switches
  gather_facts: false
  connection: ansible.netcommon.network_cli

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    switch_vlan_source: >-
      {{ ansible_project_dir }}/vars/switches/{{ inventory_hostname }}-vlans.yml
    switch_platform_profile: sks8300
    switch_config_apply: false
    switch_config_allowed_operations:
      - create
      - update
      - remove
      - no-op

  pre_tasks:
    - name: Load desired SKS8300 VLAN configuration
      ansible.builtin.include_vars:
        file: "{{ switch_vlan_source }}"

  roles:
    - switch_config
