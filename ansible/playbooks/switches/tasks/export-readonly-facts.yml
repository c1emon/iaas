---
- name: Validate switch export settings
  ansible.builtin.assert:
    that:
      - switch_export_formats | length > 0
      - switch_export_formats | difference(['yaml', 'json']) | length == 0
      - switch_export_dir | length > 0
      - switch_raw_output_dir | length > 0
    fail_msg: >-
      Configure switch_export_formats with yaml/json values and provide
      switch_export_dir and switch_raw_output_dir before running the export workflow.

- name: Create local switch export directory
  ansible.builtin.file:
    path: "{{ switch_export_dir }}"
    state: directory
    mode: "0700"

- name: Create raw output directory when enabled
  ansible.builtin.file:
    path: "{{ switch_raw_output_dir }}"
    state: directory
    mode: "0700"
  when: switch_export_save_raw | bool

- name: Write structured YAML switch facts
  ansible.builtin.copy:
    dest: "{{ switch_export_dir }}/facts.yml"
    mode: "0600"
    content: |
      {{ switch_facts | to_nice_yaml(indent=2, sort_keys=false) }}
  when: "'yaml' in switch_export_formats"

- name: Write structured JSON switch facts
  ansible.builtin.copy:
    dest: "{{ switch_export_dir }}/facts.json"
    mode: "0600"
    content: |
      {{ switch_facts | to_nice_json }}
  when: "'json' in switch_export_formats"

- name: Write raw output summary when raw output export is enabled
  ansible.builtin.copy:
    dest: "{{ switch_raw_output_dir }}/cli-output-summary.json"
    mode: "0600"
    content: |
      {{ {
        "transport": "ssh-network-cli",
        "terminal_adapter": ansible_network_os,
        "platform_profile": switch_platform_profile,
        "gather_subset": switch_readonly_gather_subset,
        "planned_command_ids": switch_read_command_plan | map(attribute='id') | list,
        "cli_result_keys": switch_cli_command_results.keys() | list | sort,
        "cli_result_count": switch_cli_command_results.results | default([]) | length,
        "cli_stdout_count": switch_cli_raw_outputs | length,
        "normalized_output_lengths": {
          "show_version": switch_command_outputs.show_version | length,
          "show_vlan": switch_command_outputs.show_vlan | length,
          "show_vlan_brief": switch_command_outputs.show_vlan_brief | length,
          "show_running_config": switch_command_outputs.show_running_config | length
        }
      } | to_nice_json }}
  when: switch_export_save_raw | bool

- name: Save profile-approved raw command outputs when enabled
  ansible.builtin.copy:
    dest: "{{ switch_raw_output_dir }}/{{ item.filename }}"
    mode: "0600"
    content: "{{ item.content }}"
  loop: "{{ switch_raw_export_items }}"
  loop_control:
    label: "{{ item.id }}"
  when: switch_export_save_raw | bool
  no_log: true

- name: Write switch export README
  ansible.builtin.copy:
    dest: "{{ switch_export_dir }}/README.md"
    mode: "0600"
    content: |
      # Switch read-only export for {{ inventory_hostname }}

      This directory contains read-only SKS8300 switch facts generated from SSH network_cli output.

      Structured exports:
      {% if 'yaml' in switch_export_formats %}
      - `facts.yml`
      {% endif %}
      {% if 'json' in switch_export_formats %}
      - `facts.json`
      {% endif %}

      Raw output export is {{ 'enabled' if switch_export_save_raw | bool else 'disabled' }}.
      When enabled, `raw-output/cli-output-summary.json` summarizes the collection run,
      command-level profile policy decides which `raw-output/*.txt` files are
      written. `raw-output/show-running-config.txt` is redacted before writing.

- name: Show switch export location
  ansible.builtin.debug:
    msg: "Wrote read-only switch facts for {{ inventory_hostname }} to {{ switch_export_dir }}"
