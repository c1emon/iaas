---
- name: Build profile-driven read-only command plan  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    switch_read_command_plan: >-  # noqa: var-naming[no-role-prefix]
      {{ switch_readonly_gather_subset | switch_read_command_plan(switch_platform_profile) }}
  no_log: true

- name: Validate planned command policy
  ansible.builtin.assert:
    that:
      - switch_read_command_plan | length > 0
      - switch_read_command_plan | selectattr('read_only', 'equalto', false) | list | length == 0
      - >-
        switch_read_command_plan | map(attribute='command') |
        select('regex', '(?i)^(config|configure|write|copy|reload|delete|clear|format)\\b') |
        list | length == 0
    fail_msg: >-
      Profile command planning produced an unsafe or empty command plan for
      {{ switch_platform_profile }} and {{ switch_readonly_gather_subset }}.
