---
- name: Collect read-only switch command output through native XikeOS collection
  c1emon.xikeos.xikeos_command:
    commands: "{{ switch_read_command_plan | map(attribute='command') | list }}"
  register: switch_cli_command_results  # noqa: var-naming[no-role-prefix]
  changed_when: false
  no_log: true

- name: Select raw SSH CLI output payload  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    switch_cli_raw_outputs: >-
      {{ switch_cli_command_results.stdout | default([]) }}
  no_log: true
