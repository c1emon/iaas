---
- name: Collect current switch state for configuration planning through native XikeOS collection
  c1emon.xikeos.xikeos_command:
    commands: "{{ switch_config_collect_command_plan | map(attribute='command') | list }}"
  register: switch_config_collect_results  # noqa: var-naming[no-role-prefix]
  changed_when: false
  no_log: true

- name: Select current-state raw SSH CLI output  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    switch_config_cli_raw_outputs: >-  # noqa: var-naming[no-role-prefix]
      {{ switch_config_collect_results.stdout | default([]) }}
  no_log: true
