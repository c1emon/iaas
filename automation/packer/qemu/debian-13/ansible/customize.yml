---
- name: Configure the Debian image while it is online
  hosts: all
  become: true
  gather_facts: true
  vars:
    packages_list: "{{ packages_json | from_json }}"
  tasks:
    - name: Configure Debian sources
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/debian.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ apt_mirror }}
          Suites: trixie trixie-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: {{ apt_security_mirror }}
          Suites: trixie-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    - name: Remove legacy sources file
      ansible.builtin.file:
        path: /etc/apt/sources.list
        state: absent
    - name: Refresh package metadata
      ansible.builtin.apt:
        update_cache: true
    - name: Upgrade installed packages during construction
      ansible.builtin.apt:
        upgrade: dist
      when: image_package_upgrade | bool
    - name: Install requested image packages
      ansible.builtin.apt:
        name: "{{ packages_list + ['locales', 'tzdata', 'util-linux-extra'] + (['cloud-init', 'cloud-guest-utils'] if image_cloud_init == 'installed' else []) + (['qemu-guest-agent'] if image_guest_agent == 'installed' else []) + ['openssh-server'] }}"
        state: present
        install_recommends: false
    - name: Preserve image sources and automatic clone disk growth
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-iaas-image.cfg
        mode: "0644"
        content: |
          apt:
            preserve_sources_list: true
          growpart:
            mode: auto
            devices: ['/']
          resize_rootfs: true
      when: image_cloud_init == 'installed'
    - name: Enable requested services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        masked: false
      loop: "{{ (['cloud-init-main.service'] if image_cloud_init == 'installed' else []) + (['qemu-guest-agent'] if image_guest_agent == 'installed' else []) }}"
    - name: Set image timezone
      community.general.timezone:
        name: "{{ image_timezone }}"
    - name: Configure locale
      community.general.locale_gen:
        name: "{{ image_locale }}"
        state: present
