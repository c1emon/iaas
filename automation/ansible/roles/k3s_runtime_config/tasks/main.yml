---
- name: Validate the composed K3s runtime model
  ansible.builtin.assert:
    that:
      - k3s_runtime_model is mapping
      - k3s_runtime_model.schema_version | default(0) | int == 1
      - k3s_runtime_model.cluster is mapping
      - k3s_runtime_node is mapping
      - k3s_runtime_node.vm_ref is defined
      - k3s_runtime_node.role in ['server', 'agent']
      - k3s_runtime_state in ['present', 'absent']
    fail_msg: k3s_runtime_config requires a validated composed model and node
  changed_when: false
  no_log: true

- name: Require the protected runtime secret channel
  ansible.builtin.assert:
    that:
      - k3s_runtime_secret_file | string | length > 0
    fail_msg: k3s_runtime_config requires an explicit protected runtime secret file
  when: k3s_runtime_state == 'present'
  changed_when: false
  no_log: true

- name: Inspect declared TLS files without changing them
  ansible.builtin.stat:
    path: "{{ lookup('k3s_protected_secret', item, secret_file=k3s_runtime_secret_file) }}"
    get_checksum: false
    follow: false
  loop: >-
    {{ ((k3s_runtime_model.cluster.registry.mirrors
         | map(attribute='ca_ref') | select | list)
        + (k3s_runtime_model.cluster.registry.mirrors
           | map(attribute='client_cert_ref') | select | list)
        + (k3s_runtime_model.cluster.registry.mirrors
           | map(attribute='client_key_ref') | select | list))
       | unique | list }}
  loop_control:
    label: "{{ item }}"
  register: k3s_runtime_config_tls_status
  when: k3s_runtime_state == 'present'
  changed_when: false
  no_log: true

- name: Require existing restrictive TLS files
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - item.stat.mode | default('') == k3s_runtime_tls_file_mode
    fail_msg: declared K3s TLS files must already exist as regular files with restrictive permissions
  loop: "{{ k3s_runtime_config_tls_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: k3s_runtime_state == 'present'
  changed_when: false
  no_log: true

- name: Ensure K3s runtime configuration directory exists
  ansible.builtin.file:
    path: "{{ k3s_runtime_config_dir }}"
    state: directory
    owner: "{{ k3s_runtime_owner }}"
    group: "{{ k3s_runtime_group }}"
    mode: '0750'
  when: k3s_runtime_state == 'present'
  no_log: true
  diff: false

- name: Render role-owned K3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_runtime_config_path }}"
    owner: "{{ k3s_runtime_owner }}"
    group: "{{ k3s_runtime_group }}"
    mode: '0600'
  when: k3s_runtime_state == 'present'
  notify: Restart K3s runtime service
  no_log: true
  diff: false

- name: Render role-owned containerd registry configuration
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: "{{ k3s_runtime_registries_path }}"
    owner: "{{ k3s_runtime_owner }}"
    group: "{{ k3s_runtime_group }}"
    mode: '0600'
  when: k3s_runtime_state == 'present'
  notify: Restart K3s runtime service
  no_log: true
  diff: false

- name: Render role-owned K3s systemd proxy environment
  ansible.builtin.template:
    src: systemd-env.j2
    dest: "{{ k3s_runtime_service_env_path }}"
    owner: "{{ k3s_runtime_owner }}"
    group: "{{ k3s_runtime_group }}"
    mode: '0600'
  when: k3s_runtime_state == 'present'
  notify: Restart K3s runtime service
  no_log: true
  diff: false

- name: Retire role-owned K3s runtime files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ k3s_runtime_config_path }}"
    - "{{ k3s_runtime_registries_path }}"
    - "{{ k3s_runtime_service_env_path }}"
  when: k3s_runtime_state == 'absent'
  notify: Restart K3s runtime service
  no_log: true
  diff: false
