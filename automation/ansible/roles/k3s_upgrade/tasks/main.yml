---
- name: Validate the selected upgrade node and immutable plan inputs
  ansible.builtin.assert:
    that:
      - k3s_upgrade_model is mapping
      - k3s_upgrade_model.schema_version | default(0) | int == 1
      - k3s_upgrade_model.cluster is mapping
      - k3s_upgrade_node is mapping
      - k3s_upgrade_node.vm_ref | default('') == inventory_hostname
      - k3s_upgrade_node.role in ['server', 'agent']
      - k3s_upgrade_target_version | string | length > 0
      - k3s_upgrade_observed_version | string | length > 0
      - k3s_upgrade_service_name in ['k3s', 'k3s-agent']
    fail_msg: k3s_upgrade requires one declared node and a validated target/observation
    quiet: true
  changed_when: false

- name: Select synthetic health results without contacting the node
  ansible.builtin.set_fact:
    k3s_upgrade_pre_health_rc: "{{ k3s_upgrade_synthetic_result.pre_health_rc | default(0) | int }}"
    k3s_upgrade_pre_health_stdout: "{{ k3s_upgrade_synthetic_result.pre_health_stdout | default('ok') }}"
    k3s_upgrade_stop_rc: "{{ k3s_upgrade_synthetic_result.stop_rc | default(0) | int }}"
    k3s_upgrade_post_health_rc: "{{ k3s_upgrade_synthetic_result.post_health_rc | default(0) | int }}"
    k3s_upgrade_post_health_stdout: >-
      {{ k3s_upgrade_synthetic_result.post_health_stdout
         | default('ok' if k3s_upgrade_node.role == 'server'
                   else k3s_upgrade_synthetic_result.post_nodes_stdout | default('')) }}
    k3s_upgrade_post_etcd_stdout: "{{ k3s_upgrade_synthetic_result.post_etcd_stdout | default('[+]etcd ok') }}"
    k3s_upgrade_post_service_rc: "{{ k3s_upgrade_synthetic_result.post_service_rc | default(0) | int }}"
    k3s_upgrade_post_service_stdout: "{{ k3s_upgrade_synthetic_result.post_service_stdout | default('active') }}"
    k3s_upgrade_post_nodes_rc: "{{ k3s_upgrade_synthetic_result.post_nodes_rc | default(0) | int }}"
    k3s_upgrade_post_nodes_stdout: "{{ k3s_upgrade_synthetic_result.post_nodes_stdout | default(inventory_hostname) }}"
  when: k3s_upgrade_synthetic | bool
  changed_when: false

- name: Probe the selected server API before an upgrade
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - --raw=/readyz
  register: k3s_upgrade_pre_api_command
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  no_log: true
  when:
    - not (k3s_upgrade_synthetic | bool)
    - k3s_upgrade_node.role == 'server'

- name: Probe the selected node service before an upgrade
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ k3s_upgrade_service_name }}"
  register: k3s_upgrade_pre_service_command
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when: not (k3s_upgrade_synthetic | bool)

- name: Normalize live pre-upgrade health results
  ansible.builtin.set_fact:
    k3s_upgrade_pre_health_rc: >-
      {{ k3s_upgrade_pre_api_command.rc | default(1) | int
         if k3s_upgrade_node.role == 'server'
         else k3s_upgrade_pre_service_command.rc | default(1) | int }}
    k3s_upgrade_pre_health_stdout: >-
      {{ k3s_upgrade_pre_api_command.stdout | default('') | trim
         if k3s_upgrade_node.role == 'server'
         else k3s_upgrade_pre_service_command.stdout | default('') | trim }}
  when: not (k3s_upgrade_synthetic | bool)
  changed_when: false

- name: Require health before skipping an exact-target node or mutating a node
  ansible.builtin.assert:
    that:
      - k3s_upgrade_pre_health_rc | int == 0
      - >-
        (k3s_upgrade_node.role == 'server' and k3s_upgrade_pre_health_stdout | lower == 'ok')
        or (k3s_upgrade_node.role == 'agent' and k3s_upgrade_pre_health_stdout | lower == 'active')
    fail_msg: >-
      K3s {{ k3s_upgrade_node.vm_ref }} failed its pre-upgrade health check;
      upgrade stopped before mutation
    quiet: true
  changed_when: false

- name: Report an already-target node and leave it untouched
  ansible.builtin.debug:
    msg: "SKIP upgrade.{{ k3s_upgrade_node.vm_ref }}: exact target {{ k3s_upgrade_target_version }} already observed"
  when: k3s_upgrade_skip | bool
  changed_when: false

- name: Stop the selected K3s service before replacing its executable
  ansible.builtin.systemd:
    name: "{{ k3s_upgrade_service_name }}"
    state: stopped
  register: k3s_upgrade_stop_service
  failed_when: false
  when:
    - not (k3s_upgrade_skip | bool)
    - not (k3s_upgrade_synthetic | bool)
  no_log: true

- name: Normalize the synthetic stop result
  ansible.builtin.set_fact:
    k3s_upgrade_stop_service:
      rc: "{{ k3s_upgrade_stop_rc | int }}"
      failed: "{{ k3s_upgrade_stop_rc | int != 0 }}"
  when:
    - not (k3s_upgrade_skip | bool)
    - k3s_upgrade_synthetic | bool
  changed_when: false

- name: Refuse to continue after a failed service stop
  ansible.builtin.assert:
    that:
      - not (k3s_upgrade_stop_service.failed | default(false) | bool)
      - k3s_upgrade_stop_service.rc | default(0) | int == 0
    fail_msg: "K3s {{ k3s_upgrade_node.vm_ref }} service stop failed; upgrade stopped"
    quiet: true
  when: not (k3s_upgrade_skip | bool)
  changed_when: false

- name: Acquire the exact target executable with its pinned checksum
  ansible.builtin.include_role:
    name: k3s_acquisition
  vars:
    k3s_acquisition_model_node: "{{ k3s_upgrade_node }}"
    k3s_acquisition_cluster: "{{ k3s_upgrade_model.cluster }}"
    k3s_acquisition_binary_path: "{{ k3s_upgrade_binary_path }}"
    k3s_acquisition_runtime_proxy: "{{ k3s_upgrade_runtime_proxy }}"
    k3s_acquisition_runtime_secret_file: "{{ k3s_upgrade_runtime_secret_file }}"
  when:
    - not (k3s_upgrade_skip | bool)
    - not (k3s_upgrade_synthetic | bool)

- name: Start the selected K3s service after replacing its executable
  ansible.builtin.systemd:
    name: "{{ k3s_upgrade_service_name }}"
    state: started
  register: k3s_upgrade_start_service
  failed_when: false
  when:
    - not (k3s_upgrade_skip | bool)
    - not (k3s_upgrade_synthetic | bool)
  no_log: true

- name: Normalize synthetic post-upgrade results
  ansible.builtin.set_fact:
    k3s_upgrade_start_service:
      rc: "{{ k3s_upgrade_post_service_rc | int }}"
      failed: "{{ k3s_upgrade_post_service_rc | int != 0 }}"
  when:
    - not (k3s_upgrade_skip | bool)
    - k3s_upgrade_synthetic | bool
  changed_when: false

- name: Refuse to continue after a failed service start
  ansible.builtin.assert:
    that:
      - not (k3s_upgrade_start_service.failed | default(false) | bool)
      - k3s_upgrade_start_service.rc | default(0) | int == 0
    fail_msg: "K3s {{ k3s_upgrade_node.vm_ref }} service start failed; upgrade stopped"
    quiet: true
  when: not (k3s_upgrade_skip | bool)
  changed_when: false

- name: Probe the upgraded server API
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - --raw=/readyz
  register: k3s_upgrade_post_api_command
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  no_log: true
  when:
    - not (k3s_upgrade_skip | bool)
    - not (k3s_upgrade_synthetic | bool)
    - k3s_upgrade_node.role == 'server'

- name: Probe upgraded server embedded-etcd health
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - --raw=/readyz?verbose
  register: k3s_upgrade_post_etcd_command
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  no_log: true
  when:
    - not (k3s_upgrade_skip | bool)
    - not (k3s_upgrade_synthetic | bool)
    - k3s_upgrade_node.role == 'server'

- name: Probe the upgraded agent service
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - k3s-agent
  register: k3s_upgrade_post_agent_service_command
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when:
    - not (k3s_upgrade_skip | bool)
    - not (k3s_upgrade_synthetic | bool)
    - k3s_upgrade_node.role == 'agent'

- name: Verify upgraded agent registration from the K3s API server
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - nodes
      - -o
      - name
  delegate_to: "{{ k3s_upgrade_api_host | default(inventory_hostname, true) }}"
  register: k3s_upgrade_post_nodes_command
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  no_log: true
  when:
    - not (k3s_upgrade_skip | bool)
    - not (k3s_upgrade_synthetic | bool)
    - k3s_upgrade_node.role == 'agent'

- name: Normalize live post-upgrade verification results
  ansible.builtin.set_fact:
    k3s_upgrade_post_health_rc: >-
      {{ k3s_upgrade_post_api_command.rc | default(1) | int
         if k3s_upgrade_node.role == 'server'
         else k3s_upgrade_post_nodes_command.rc | default(1) | int }}
    k3s_upgrade_post_health_stdout: >-
      {{ k3s_upgrade_post_api_command.stdout | default('') | trim
         if k3s_upgrade_node.role == 'server'
         else k3s_upgrade_post_nodes_command.stdout | default('') | trim }}
    k3s_upgrade_post_service_rc: >-
      {{ 0 if k3s_upgrade_node.role == 'server'
         else k3s_upgrade_post_agent_service_command.rc | default(1) | int }}
    k3s_upgrade_post_service_stdout: >-
      {{ 'active' if k3s_upgrade_node.role == 'server'
         else k3s_upgrade_post_agent_service_command.stdout | default('') | trim }}
    k3s_upgrade_post_etcd_stdout: >-
      {{ k3s_upgrade_post_etcd_command.stdout | default('') | trim
         if k3s_upgrade_node.role == 'server' else '' }}
  when:
    - not (k3s_upgrade_skip | bool)
    - not (k3s_upgrade_synthetic | bool)
  changed_when: false

- name: Require API, etcd, node registration, and service health after upgrade
  ansible.builtin.assert:
    that:
      - k3s_upgrade_post_health_rc | int == 0
      - >-
        (k3s_upgrade_node.role == 'server'
         and k3s_upgrade_post_health_stdout | lower == 'ok'
         and 'etcd ok' in (k3s_upgrade_post_etcd_stdout | default('') | lower))
        or (k3s_upgrade_node.role == 'agent'
            and k3s_upgrade_node.vm_ref in k3s_upgrade_post_health_stdout
            and k3s_upgrade_post_service_rc | int == 0
            and k3s_upgrade_post_service_stdout | lower == 'active')
    fail_msg: >-
      K3s {{ k3s_upgrade_node.vm_ref }} failed post-upgrade API/etcd or
      node/service verification; upgrade stopped
    quiet: true
  when: not (k3s_upgrade_skip | bool)
  changed_when: false
