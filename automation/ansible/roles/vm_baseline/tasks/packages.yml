---
- name: Assemble baseline package list
  ansible.builtin.set_fact:
    vm_baseline_packages_to_install: >-
      {{ (vm_baseline_packages + vm_baseline_time_sync_packages) | flatten | unique }}
  changed_when: false

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ vm_baseline_packages_to_install }}"
    state: present
    update_cache: "{{ vm_baseline_update_cache }}"
    cache_valid_time: "{{ vm_baseline_cache_valid_time }}"
  when: vm_baseline_packages_to_install | length > 0
