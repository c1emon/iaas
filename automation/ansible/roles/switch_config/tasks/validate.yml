---
- name: Define supported collection-native switch resources  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    switch_config_supported_resources:  # noqa: var-naming[no-role-prefix]
      - vlans
      - base_interfaces
      - lag_interfaces
      - l2_interfaces
      - l3_interfaces
      - static_routes
      - acls
    switch_config_forbidden_command_pattern: >-  # noqa: var-naming[no-role-prefix]
      (?i)(reload|erase|write erase|delete startup-config|format|factory|reset|boot system)
  no_log: true

- name: Validate switch configuration runtime settings
  ansible.builtin.assert:
    that:
      - ansible_user | length > 0
      - ansible_password | length > 0
      - ansible_port | string | length > 0
      - ansible_connection == 'ansible.netcommon.network_cli'
      - ansible_network_os == 'c1emon.xikeos.xikeos'
      - switch_config_intent is not defined
      - switch_config_resources is mapping
      - switch_config_allowed_states | length > 0
      - switch_config_commands is not defined
      - switch_config_resources.keys() | difference(switch_config_supported_resources) | length == 0
    fail_msg: >-
      Supply runtime network_cli credentials from inventory or runtime variables,
      and provide collection-native switch_config_resources entries. Legacy
      switch_config_intent and raw switch_config_commands are not supported.

- name: Flatten requested collection-native resource calls  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    switch_config_requested_calls: >-  # noqa: var-naming[no-role-prefix]
      {{ switch_config_resources | dict2items | map(attribute='value') | flatten }}
  no_log: true

- name: Validate collection-native resource call groups
  ansible.builtin.assert:
    that:
      - item.value is sequence
      - item.value is not string
    fail_msg: >-
      switch_config_resources.{{ item.key }} must be a list of module calls.
  loop: "{{ switch_config_resources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Validate collection-native resource calls
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.state is defined
      - item.config is defined
      - item.state in switch_config_allowed_states
      - item.config is sequence
      - item.config is not string
    fail_msg: >-
      Each switch_config_resources entry must include state and config fields,
      and state must be included in switch_config_allowed_states.
  loop: "{{ switch_config_requested_calls }}"
  loop_control:
    label: "{{ item.state | default('missing-state') }}"
  no_log: true
