---
- name: Require one composed node and cluster artifact map
  ansible.builtin.assert:
    that:
      - k3s_acquisition_model_node is mapping
      - k3s_acquisition_model_node.architecture | default('') | length > 0
      - k3s_acquisition_cluster is mapping
      - k3s_acquisition_cluster.artifacts is mapping
      - k3s_acquisition_cluster.version | default('') | length > 0
    fail_msg: "K3s acquisition requires validated composed node and cluster facts"
  changed_when: false

- name: Select the architecture-bound pinned artifact from the composed model
  ansible.builtin.set_fact:
    k3s_acquisition_artifact: >-
      {{ k3s_acquisition_cluster.artifacts[k3s_acquisition_model_node.architecture]
         | default({}) }}
  changed_when: false
  no_log: true

- name: Require the selected artifact to be exact and complete
  ansible.builtin.assert:
    that:
      - k3s_acquisition_artifact is mapping
      - k3s_acquisition_artifact.url | default('', true) is match('^https://')
      - k3s_acquisition_artifact.sha256 | default('', true) is match('^[a-f0-9]{64}$')
      - k3s_acquisition_artifact.url is not search('[?#]')
      - >-
        (k3s_acquisition_artifact.credential_ref | default('', true) | length == 0)
        or (k3s_acquisition_runtime_secret_file | default('', true) | string | length > 0)
    fail_msg: >-
      K3s acquisition requires a caller-selected HTTPS URL, SHA-256,
      and an explicit protected runtime secret path when authentication is declared
  changed_when: false
  no_log: true

- name: Acquire the exact pinned K3s executable through the resolved artifact path
  ansible.builtin.get_url:
    url: "{{ k3s_acquisition_artifact.url }}"
    dest: "{{ k3s_acquisition_binary_path }}"
    checksum: "sha256:{{ k3s_acquisition_artifact.sha256 }}"
    owner: root
    group: root
    mode: "0755"
  environment:
    https_proxy: >-
      {%- if k3s_acquisition_artifact.credential_ref | default('', true) | length > 0 -%}
      {% set credentials = lookup('k3s_protected_secret', k3s_acquisition_artifact.credential_ref,
                                  secret_file=k3s_acquisition_runtime_secret_file) | from_json -%}
      {{ k3s_acquisition_artifact.proxy_url
         | regex_replace('://', '://' ~ credentials.username ~ ':' ~ credentials.password ~ '@') }}
      {%- else -%}
      {{ k3s_acquisition_artifact.proxy_url | default('', true) }}
      {%- endif -%}
    HTTPS_PROXY: >-
      {%- if k3s_acquisition_artifact.credential_ref | default('', true) | length > 0 -%}
      {% set credentials = lookup('k3s_protected_secret', k3s_acquisition_artifact.credential_ref,
                                  secret_file=k3s_acquisition_runtime_secret_file) | from_json -%}
      {{ k3s_acquisition_artifact.proxy_url
         | regex_replace('://', '://' ~ credentials.username ~ ':' ~ credentials.password ~ '@') }}
      {%- else -%}
      {{ k3s_acquisition_artifact.proxy_url | default('', true) }}
      {%- endif -%}
  no_log: true

- name: Read the acquired executable version
  ansible.builtin.command:
    argv:
      - "{{ k3s_acquisition_binary_path }}"
      - --version
  register: k3s_acquisition_observed_version
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  no_log: true

- name: Require the exact declared version from the acquired executable
  ansible.builtin.assert:
    that:
      - k3s_acquisition_observed_version.rc | default(1) == 0
      - >-
        k3s_acquisition_observed_version.stdout | default('')
        is match('^k3s version ' ~ (k3s_acquisition_cluster.version | regex_escape) ~ '(?:\s|$)')
    fail_msg: acquired K3s executable does not report the exact declared version
    quiet: true
  when: not ansible_check_mode
  changed_when: false
