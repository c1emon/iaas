---
- name: Gather minimal and network facts for {{ k3s_preflight_node.vm_ref }}
  ansible.builtin.setup:
    gather_subset:
      - min
      - network
  delegate_to: "{{ k3s_preflight_node.vm_ref }}"
  register: k3s_preflight_setup
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when: hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined

- name: Record reachability for {{ k3s_preflight_node.vm_ref }}
  ansible.builtin.set_fact:
    k3s_preflight_results: "{{ k3s_preflight_results | default([]) + [k3s_preflight_reachability] }}"
    k3s_preflight_reachable: >-
      {{ hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is defined or
         not (k3s_preflight_setup.unreachable | default(false)
              or k3s_preflight_setup.failed | default(false)) }}
  vars:
    k3s_preflight_reachability:
      severity: >-
        {{ 'PASS' if (hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is defined
                       or not (k3s_preflight_setup.unreachable | default(false)
                               or k3s_preflight_setup.failed | default(false))) else 'WARN' }}
      line: >-
        {{ ('PASS ssh.' if (hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is defined
                             or not (k3s_preflight_setup.unreachable | default(false)
                                     or k3s_preflight_setup.failed | default(false))) else 'WARN ssh.')
           ~ k3s_preflight_node.vm_ref ~ '.reachability: '
           ~ ('host is reachable' if (hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is defined
                                       or not (k3s_preflight_setup.unreachable | default(false)
                                               or k3s_preflight_setup.failed | default(false)))
              else 'host is unreachable; checks were not attempted') }}
  changed_when: false

- name: Block deployment and upgrade when required host observations are unavailable
  ansible.builtin.assert:
    that:
      - k3s_preflight_reachable or k3s_preflight_mode == 'install'
    fail_msg: required host is unreachable; no mutation admission can be established
    quiet: true
  changed_when: false

- name: Probe read-only host prerequisites
  ansible.builtin.command: "{{ k3s_preflight_probe.command }}"
  delegate_to: "{{ k3s_preflight_node.vm_ref }}"
  register: k3s_preflight_probes
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  loop:
    - name: cgroups
      command: "stat -fc %T /sys/fs/cgroup"
    - name: capabilities
      command: "grep CapEff /proc/1/status"
    - name: time
      command: "timedatectl show -p NTPSynchronized --value"
    - name: interface
      command: "ip -o addr show"
    - name: ports
      command: "ss -lntu"
    - name: disk
      command: >-
        python3 -c 'import os,shutil; p="/var/lib/rancher";
        p=next(x for x in [p,"/var/lib","/var","/"] if os.path.isdir(x));
        print(shutil.disk_usage(p).free)'
    - name: apt_sources
      command: >-
        python3 -c 'from pathlib import Path; import re;
        paths=[Path("/etc/apt/sources.list"),*Path("/etc/apt/sources.list.d").glob("*.list"),
        *Path("/etc/apt/sources.list.d").glob("*.sources")];
        print("\n".join(line for p in paths if p.is_file() for line in p.read_text().splitlines()
        if re.match(r"^\s*(deb\s|URIs:)",line)))'
  loop_control:
    loop_var: k3s_preflight_probe
    label: "{{ k3s_preflight_probe.name }}"
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined

- name: Probe each required K3s port for a listener without changing socket state
  ansible.builtin.command:
    argv:
      - ss
      - -H
      - -lntu
      - sport
      - "="
      - ":{{ item }}"
  delegate_to: "{{ k3s_preflight_node.vm_ref }}"
  loop: "{{ k3s_preflight_required_ports }}"
  loop_control:
    label: "port {{ item }}"
  register: k3s_preflight_port_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined

- name: Use synthetic preflight facts without contacting a host
  ansible.builtin.set_fact:
    k3s_preflight_runtime: "{{ hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts }}"
  when: hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is defined
  changed_when: false

- name: Parse the exact observed node address and interface
  ansible.builtin.set_fact:
    k3s_preflight_observed_interface: >-
      {{ k3s_preflight_probes.results[3]
         | k3s_interface_observation(k3s_preflight_node.node_ip, k3s_preflight_node.node_nic) }}
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
  changed_when: false

- name: Observe installation ownership without exposing configuration or tokens
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/probe_installation.py') }}"
    stdin: >-
      {{ {'role': k3s_preflight_node.role,
          'sha256': k3s_runtime_model.cluster.artifacts[k3s_preflight_node.architecture].sha256,
          'config': lookup('ansible.builtin.template', role_path ~ '/../k3s_runtime_config/templates/config.yaml.j2'),
          'unit': lookup('ansible.builtin.template', role_path ~ '/../'
                         ~ ('k3s_server/templates/k3s.service.j2' if k3s_preflight_node.role == 'server'
                            else 'k3s_agent/templates/k3s-agent.service.j2'))} | to_json }}
  vars:
    k3s_runtime_model: "{{ hostvars['localhost'].k3s_model }}"
    k3s_runtime_node: "{{ k3s_preflight_node }}"
    k3s_runtime_join_token: ""
    k3s_server_binary_path: /usr/local/bin/k3s
    k3s_agent_binary_path: /usr/local/bin/k3s
  delegate_to: "{{ k3s_preflight_node.vm_ref }}"
  register: k3s_preflight_installation_probe
  changed_when: false
  failed_when: false
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
  no_log: true

- name: Build runtime facts from read-only probes
  ansible.builtin.set_fact:
    k3s_preflight_runtime:
      os_family: "{{ k3s_preflight_setup.ansible_facts.ansible_os_family | default('unknown') }}"
      distribution: "{{ k3s_preflight_setup.ansible_facts.ansible_distribution | default('unknown') }}"
      architecture: "{{ k3s_preflight_setup.ansible_facts.ansible_architecture | default('unknown') }}"
      pve_architecture: "{{ hostvars[k3s_preflight_node.vm_ref].pve_architecture | default('unknown') }}"
      cgroups_v2: "{{ k3s_preflight_probes.results[0].stdout | default('') == 'cgroup2fs' }}"
      kernel_capabilities: >-
        {{ k3s_preflight_probes.results[1] | k3s_capabilities }}
      time_synchronized: >-
        {{ k3s_preflight_probes.results[2].stdout | default('') | trim | lower == 'yes' }}
      node_ip: "{{ k3s_preflight_observed_interface.node_ip }}"
      node_interface: "{{ k3s_preflight_observed_interface.node_interface }}"
      ports_available: >-
        {%- set ns = namespace(ok=(k3s_preflight_probes.results[4].rc | default(1) | int == 0)) -%}
        {%- for result in k3s_preflight_port_checks.results | default([]) -%}
        {%- if result.rc | default(1) | int != 0 or result.stdout | default('') | trim | length > 0 -%}
        {%- set ns.ok = false -%}
        {%- endif -%}
        {%- endfor -%}
        {{- ns.ok -}}
      free_bytes: >-
        {{ k3s_preflight_probes.results[5].stdout | default('0') | int
           if k3s_preflight_probes.results[5].rc | default(1) == 0 else 0 }}
      apt_sources_reachable: "{{ k3s_preflight_probes.results[6].rc | default(1) == 0 }}"
      artifact_reachable: false
      registry_reachable: false
      registry_tls_files_valid: false
      installation: "{{ k3s_preflight_installation_probe.stdout | default('{}', true) | from_json }}"
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
  changed_when: false

- name: Validate action-scoped runtime credentials before endpoint checks
  ansible.builtin.set_fact:
    k3s_preflight_synthetic_credentials_ok: >-
      {{ hostvars[k3s_preflight_node.vm_ref].k3s_preflight_credentials | bool
         if (hostvars[k3s_preflight_node.vm_ref].k3s_preflight_credentials is defined
             and hostvars[k3s_preflight_node.vm_ref].k3s_preflight_credentials is boolean)
         else false }}
  changed_when: false

- name: Resolve endpoint checks from the composed model without exposing secrets
  ansible.builtin.set_fact:
    k3s_preflight_cluster: "{{ hostvars['localhost'].k3s_model.cluster | default({}) }}"
    k3s_preflight_artifact: >-
      {{ (hostvars['localhost'].k3s_model.cluster.artifacts[k3s_preflight_node.architecture]
          | default({}))
         if hostvars['localhost'].k3s_model is defined else {} }}
    k3s_preflight_registry_mirrors: >-
      {{ hostvars['localhost'].k3s_model.cluster.registry.mirrors | default([])
         if hostvars['localhost'].k3s_model is defined else [] }}
    k3s_preflight_service_proxy: >-
      {{ hostvars['localhost'].k3s_model.cluster.service_proxy | default({})
         if hostvars['localhost'].k3s_model is defined else {} }}
    k3s_preflight_tls_refs: >-
      {{ (hostvars['localhost'].k3s_model.cluster.registry.mirrors
          | map(attribute='ca_ref') | select | list
          | union(hostvars['localhost'].k3s_model.cluster.registry.mirrors
                 | map(attribute='client_cert_ref') | select | list)
          | union(hostvars['localhost'].k3s_model.cluster.registry.mirrors
                 | map(attribute='client_key_ref') | select | list))
         if hostvars['localhost'].k3s_model is defined else [] }}
  changed_when: false
  no_log: true

- name: Resolve credential and TLS reference sets without retaining secret values
  ansible.builtin.set_fact:
    k3s_preflight_required_credential_refs: >-
      {{ ([k3s_preflight_artifact.credential_ref]
          if k3s_preflight_artifact.credential_ref | default('', true) | length > 0 else [])
         | union(k3s_preflight_registry_mirrors
                | map(attribute='auth_ref') | select | list)
         | union(([k3s_preflight_service_proxy.credential_ref]
                 if k3s_preflight_service_proxy.credential_ref | default('', true) | length > 0
                 else [])) }}
  changed_when: false
  no_log: true

- name: Confirm action-scoped endpoint credentials are complete
  ansible.builtin.set_fact:
    k3s_preflight_credentials_ok: >-
      {{ k3s_preflight_synthetic_credentials_ok | default(false) | bool
         if hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is defined
         else ((k3s_preflight_required_credential_refs | length == 0)
               or (k3s_preflight_runtime_secret_file | default('', true) | string | length > 0)) }}
  changed_when: false
  no_log: true

- name: Require every declared endpoint credential to be action-scoped
  ansible.builtin.assert:
    that:
      - >-
        k3s_preflight_credentials_ok | bool
    fail_msg: "declared artifact, registry, or proxy access requires its action-scoped runtime credential"
  when: k3s_preflight_reachable | default(false)
  changed_when: false
  no_log: true

- name: Read configured APT source URLs without updating or rewriting APT
  ansible.builtin.uri:
    url: "{{ item }}"
    method: HEAD
    return_content: false
    follow_redirects: safe
    status_code: [200, 204, 301, 302, 403]
    timeout: "{{ k3s_preflight_endpoint_timeout }}"
  delegate_to: "{{ k3s_preflight_node.vm_ref }}"
  loop: "{{ k3s_preflight_probes.results[6].stdout | default('') | regex_findall('https?://[^\\s]+') }}"
  loop_control:
    label: apt-source
  register: k3s_preflight_apt_source_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
  no_log: true

- name: Probe the selected architecture artifact through its acquisition path
  ansible.builtin.uri:
    url: "{{ k3s_preflight_artifact.url }}"
    method: HEAD
    return_content: false
    follow_redirects: safe
    status_code: [200, 204, 301, 302]
    timeout: "{{ k3s_preflight_endpoint_timeout }}"
  environment:
    https_proxy: >-
      {%- if k3s_preflight_artifact.credential_ref | default('', true) | length > 0 -%}
      {% set credentials = lookup('k3s_protected_secret', k3s_preflight_artifact.credential_ref,
                                  secret_file=k3s_preflight_runtime_secret_file) | from_json -%}
      {{ k3s_preflight_artifact.proxy_url
         | regex_replace('://', '://' ~ credentials.username ~ ':' ~ credentials.password ~ '@') }}
      {%- else -%}
      {{ k3s_preflight_artifact.proxy_url | default('', true) }}
      {%- endif -%}
    HTTPS_PROXY: >-
      {%- if k3s_preflight_artifact.credential_ref | default('', true) | length > 0 -%}
      {% set credentials = lookup('k3s_protected_secret', k3s_preflight_artifact.credential_ref,
                                  secret_file=k3s_preflight_runtime_secret_file) | from_json -%}
      {{ k3s_preflight_artifact.proxy_url
         | regex_replace('://', '://' ~ credentials.username ~ ':' ~ credentials.password ~ '@') }}
      {%- else -%}
      {{ k3s_preflight_artifact.proxy_url | default('', true) }}
      {%- endif -%}
  delegate_to: "{{ k3s_preflight_node.vm_ref }}"
  register: k3s_preflight_artifact_check
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
    - k3s_preflight_artifact.url | default('') | length > 0
    - k3s_preflight_credentials_ok | bool
  no_log: true

- name: Validate registry TLS paths with read-only stat operations
  ansible.builtin.stat:
    path: "{{ lookup('k3s_protected_secret', item, secret_file=k3s_preflight_runtime_secret_file) }}"
    follow: false
    get_checksum: false
  delegate_to: "{{ k3s_preflight_node.vm_ref }}"
  loop: "{{ k3s_preflight_tls_refs }}"
  loop_control:
    label: registry-tls-file
  register: k3s_preflight_tls_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
    - k3s_preflight_tls_refs | length > 0
    - k3s_preflight_credentials_ok | bool
  no_log: true

- name: Reject absent, non-regular, or overly permissive registry TLS files
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.isreg | default(false) | bool
      - item.stat.mode | default('') is match('^0(600|640|644)$')
    fail_msg: "a referenced registry TLS file must exist, be regular, and use restrictive permissions"
  loop: "{{ k3s_preflight_tls_checks.results | default([]) }}"
  loop_control:
    label: registry-tls-file
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
    - k3s_preflight_tls_refs | length > 0
    - k3s_preflight_credentials_ok | bool
  changed_when: false
  no_log: true

- name: Probe each declared registry endpoint with runtime authentication and TLS
  ansible.builtin.uri:
    url: "{{ item.endpoint.rstrip('/') }}/v2/"
    method: GET
    return_content: false
    status_code: [200, 204, 401]
    validate_certs: true
    timeout: "{{ k3s_preflight_endpoint_timeout }}"
    ca_path: >-
      {{ lookup('k3s_protected_secret', item.ca_ref, secret_file=k3s_preflight_runtime_secret_file)
         if item.ca_ref | default('', true) | length > 0 else omit }}
    client_cert: >-
      {{ lookup('k3s_protected_secret', item.client_cert_ref, secret_file=k3s_preflight_runtime_secret_file)
         if item.client_cert_ref | default('', true) | length > 0 else omit }}
    client_key: >-
      {{ lookup('k3s_protected_secret', item.client_key_ref, secret_file=k3s_preflight_runtime_secret_file)
         if item.client_key_ref | default('', true) | length > 0 else omit }}
    url_username: >-
      {{ (lookup('k3s_protected_secret', item.auth_ref,
                 secret_file=k3s_preflight_runtime_secret_file) | from_json).username
         if item.auth_ref | default('', true) | length > 0 else omit }}
    url_password: >-
      {{ (lookup('k3s_protected_secret', item.auth_ref,
                 secret_file=k3s_preflight_runtime_secret_file) | from_json).password
         if item.auth_ref | default('', true) | length > 0 else omit }}
    force_basic_auth: "{{ item.auth_ref | default('', true) | length > 0 }}"
    use_proxy: false
    follow_redirects: none
  environment:
    https_proxy: >-
      {% if k3s_preflight_service_proxy.credential_ref | default('', true) | length > 0 %}
      {% set credentials = lookup('k3s_protected_secret', k3s_preflight_service_proxy.credential_ref,
                                  secret_file=k3s_preflight_runtime_secret_file) | from_json %}
      {{ k3s_preflight_service_proxy.url
         | regex_replace('://', '://' ~ credentials.username ~ ':' ~ credentials.password ~ '@') }}
      {% else %}
      {{ k3s_preflight_service_proxy.url | default('', true) }}
      {% endif %}
    HTTPS_PROXY: >-
      {% if k3s_preflight_service_proxy.credential_ref | default('', true) | length > 0 %}
      {% set credentials = lookup('k3s_protected_secret', k3s_preflight_service_proxy.credential_ref,
                                  secret_file=k3s_preflight_runtime_secret_file) | from_json %}
      {{ k3s_preflight_service_proxy.url
         | regex_replace('://', '://' ~ credentials.username ~ ':' ~ credentials.password ~ '@') }}
      {% else %}
      {{ k3s_preflight_service_proxy.url | default('', true) }}
      {% endif %}
  delegate_to: "{{ k3s_preflight_node.vm_ref }}"
  loop: "{{ k3s_preflight_registry_mirrors }}"
  loop_control:
    label: registry-endpoint
  register: k3s_preflight_registry_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
    - k3s_preflight_registry_mirrors | length > 0
    - k3s_preflight_credentials_ok | bool
  no_log: true

- name: Reset authenticated registry probe results for this node
  ansible.builtin.set_fact:
    k3s_preflight_bearer_successes: []
  changed_when: false

- name: Complete registry Bearer authentication when challenged
  ansible.builtin.include_tasks: registry-bearer.yml
  loop: "{{ k3s_preflight_registry_checks.results | default([]) }}"
  loop_control:
    loop_var: k3s_registry_challenge
    label: registry-authentication
  when:
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
    - k3s_registry_challenge.status | default(0) | int == 401
  no_log: true

- name: Merge read-only endpoint evidence into the runtime result
  ansible.builtin.set_fact:
    k3s_preflight_runtime: >-
      {{ k3s_preflight_runtime | combine({
          'apt_sources_reachable': (
            (k3s_preflight_probes.results[6].rc | default(1) | int == 0)
            and ((k3s_preflight_probes.results[6].stdout | default('')
                  | regex_findall('https?://[^\\s]+') | length) > 0)
            and ((k3s_preflight_apt_source_checks.results | default([])
                  | selectattr('status', 'in', [200, 204, 301, 302, 403]) | list | length)
                 == (k3s_preflight_probes.results[6].stdout | default('')
                     | regex_findall('https?://[^\\s]+') | length))
          ),
          'artifact_reachable': (
            k3s_preflight_artifact_check.status | default(0) | int in [200, 204, 301, 302]
          ),
          'registry_reachable': (
            (k3s_preflight_registry_mirrors | length == 0)
            or ((k3s_preflight_registry_checks.results | default([])
                 | selectattr('status', 'in', [200, 204]) | list | length)
                + (k3s_preflight_bearer_successes | length)
                == (k3s_preflight_registry_mirrors | length))
          ),
          'registry_tls_files_valid': (
            (k3s_preflight_tls_refs | length == 0)
            or ((k3s_preflight_tls_checks.results | default([])
                 | selectattr('stat.exists', 'defined') | list | length)
                == (k3s_preflight_tls_refs | length))
          )
        }) }}
  when:
    - k3s_preflight_reachable | default(false)
    - hostvars[k3s_preflight_node.vm_ref].k3s_preflight_facts is not defined
  changed_when: false
  no_log: true

- name: Record host prerequisite outcomes for {{ k3s_preflight_node.vm_ref }}
  ansible.builtin.set_fact:
    k3s_preflight_results: "{{ k3s_preflight_results + k3s_preflight_host_results }}"
  vars:
    k3s_preflight_guest_architecture: >-
      {{ 'amd64' if k3s_preflight_runtime.architecture | default('') in ['x86_64', 'amd64']
         else k3s_preflight_runtime.architecture | default('unknown') }}
    k3s_preflight_expected_architecture: "{{ k3s_preflight_node.architecture }}"
    k3s_preflight_os_ok: >-
      {{ k3s_preflight_runtime.os_family | default('') == 'Debian'
         and k3s_preflight_runtime.distribution | default('') == 'Debian' }}
    k3s_preflight_arch_ok: >-
      {{ k3s_preflight_guest_architecture == k3s_preflight_expected_architecture
         and k3s_preflight_runtime.pve_architecture | default('') == k3s_preflight_expected_architecture }}
    k3s_preflight_caps_ok: >-
      {{ (k3s_preflight_required_capabilities
          | difference(k3s_preflight_runtime.kernel_capabilities | default([])) | length) == 0 }}
    k3s_preflight_installation_ok: >-
      {{ k3s_preflight_runtime.installation | default({})
         | k3s_installation_allowed(k3s_preflight_mode, k3s_preflight_cluster.version,
                                    k3s_preflight_artifact.sha256) }}
    k3s_preflight_ports_ok: >-
      {{ k3s_preflight_runtime.ports_available | default(false)
         or (k3s_preflight_installation_ok
             and k3s_preflight_runtime.installation.state | default('') == 'managed'
             and k3s_preflight_runtime.installation.service_active | default(false)) }}
    k3s_preflight_interface_ok: >-
      {{ k3s_preflight_runtime.node_ip | default('') == k3s_preflight_node.node_ip
         and k3s_preflight_runtime.node_interface | default('') == k3s_preflight_node.node_nic }}
    k3s_preflight_disk_ok: >-
      {{ k3s_preflight_runtime.free_bytes | default(0) | int >= k3s_preflight_min_free_bytes }}
    k3s_preflight_artifact_ok: >-
      {{ k3s_preflight_runtime.artifact_reachable | default(false) | bool
         and k3s_preflight_credentials_ok }}
    k3s_preflight_registry_ok: >-
