---
- name: Validate switch export settings
  ansible.builtin.assert:
    that:
      - switch_export_formats | length > 0
      - switch_export_formats | difference(['yaml', 'json']) | length == 0
      - switch_export_dir | length > 0
      - switch_raw_output_dir | length > 0
      - not switch_export_save_raw | bool
    fail_msg: >-
      Configure switch_export_formats with yaml/json values and provide
      switch_export_dir and switch_raw_output_dir before running the export workflow.
      Raw command output export is not part of the collection-native normal
      facts workflow; use a documented smoke/debug/fallback workflow instead.

- name: Create local switch export directory
  ansible.builtin.file:
    path: "{{ switch_export_dir }}"
    state: directory
    mode: "0700"

- name: Create raw output directory when enabled
  ansible.builtin.file:
    path: "{{ switch_raw_output_dir }}"
    state: directory
    mode: "0700"
  when: switch_export_save_raw | bool

- name: Write structured YAML switch facts
  ansible.builtin.copy:
    dest: "{{ switch_export_dir }}/facts.yml"
    mode: "0600"
    content: |
      {{ switch_native_facts | to_nice_yaml(indent=2, sort_keys=false) }}
  when: "'yaml' in switch_export_formats"

- name: Write structured JSON switch facts
  ansible.builtin.copy:
    dest: "{{ switch_export_dir }}/facts.json"
    mode: "0600"
    content: |
      {{ switch_native_facts | to_nice_json }}
  when: "'json' in switch_export_formats"

- name: Write collection facts export summary
  ansible.builtin.copy:
    dest: "{{ switch_export_dir }}/collection-summary.json"
    mode: "0600"
    content: |
      {{ {
        "transport": "ssh-network-cli",
        "terminal_adapter": ansible_network_os,
        "collection_module": switch_xikeos_facts_module,
        "gather_subset": switch_xikeos_gather_subset,
        "gather_network_resources": switch_xikeos_gather_network_resources,
        "ansible_net_fact_keys": switch_native_facts.keys() | select('match', '^ansible_net_') | list | sort,
        "network_resource_keys": switch_network_resources.keys() | list | sort
      } | to_nice_json }}

- name: Write switch export README
  ansible.builtin.copy:
    dest: "{{ switch_export_dir }}/README.md"
    mode: "0600"
    content: |
      # Switch read-only export for {{ inventory_hostname }}

      This directory contains collection-native read-only XikeOS switch facts
      generated through `c1emon.xikeos.xikeos_facts` over SSH `network_cli`.

      Structured exports:
      {% if 'yaml' in switch_export_formats %}
      - `facts.yml`
      {% endif %}
      {% if 'json' in switch_export_formats %}
      - `facts.json`
      {% endif %}

      `collection-summary.json` records the collection module, requested gather subsets,
      requested network resources, transport, and terminal adapter. The normal workflow
      does not export raw command output or the former repository-specific `switch_facts`
      schema.

- name: Show switch export location
  ansible.builtin.debug:
    msg: "Wrote read-only switch facts for {{ inventory_hostname }} to {{ switch_export_dir }}"
