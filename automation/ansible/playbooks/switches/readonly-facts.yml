---
- name: Collect read-only switch CLI facts
  hosts: switches
  gather_facts: false
  connection: ansible.netcommon.network_cli

  vars:
    switch_readonly_gather_subset:  # noqa: var-naming[no-role-prefix]
      - min
    switch_readonly_gather_network_resources:  # noqa: var-naming[no-role-prefix]
      - interfaces
      - vlans
      - l2_interfaces
      - l3_interfaces
      - lag_interfaces
      - static_routes
      - acls
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: c1emon.xikeos.xikeos
    switch_export_formats:
      - yaml
      - json
    switch_export_save_raw: false
    switch_export_dir: >-
      {{ playbook_dir }}/../../../../exports/switches/{{ inventory_hostname }}
    switch_raw_output_dir: "{{ switch_export_dir }}/raw-output"

  tasks:
    - name: Validate switch runtime credentials and facts settings
      ansible.builtin.assert:
        that:
          - ansible_user | length > 0
          - ansible_password | length > 0
          - ansible_port | string | length > 0
          - ansible_connection == 'ansible.netcommon.network_cli'
          - ansible_network_os == 'c1emon.xikeos.xikeos'
          - switch_readonly_gather_subset | length > 0
          - switch_readonly_gather_network_resources | length > 0
          - >-
            switch_readonly_gather_subset |
            difference(['all', 'min', 'hardware', 'config', '!hardware', '!config']) |
            length == 0
          - >-
            switch_readonly_gather_network_resources |
            difference([
              'all', 'interfaces', 'vlans', 'l2_interfaces', 'l3_interfaces',
              'lag_interfaces', 'static_routes', 'acls', '!interfaces', '!vlans',
              '!l2_interfaces', '!l3_interfaces', '!lag_interfaces',
              '!static_routes', '!acls'
            ]) |
            length == 0
        fail_msg: >-
          Supply SWITCH_SSH_USER and SWITCH_SSH_PASSWORD at runtime, keep
          network_cli configured with the c1emon.xikeos.xikeos native platform,
          configure supported xikeos_facts gather_subset and
          gather_network_resources values.

    - name: Build collection-native XikeOS facts request  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        switch_xikeos_facts_module: c1emon.xikeos.xikeos_facts  # noqa: var-naming[no-role-prefix]
        switch_xikeos_gather_subset: "{{ switch_readonly_gather_subset }}"  # noqa: var-naming[no-role-prefix]
        switch_xikeos_gather_network_resources: >-  # noqa: var-naming[no-role-prefix]
          {{ switch_readonly_gather_network_resources }}

    - name: Collect read-only switch facts through native XikeOS collection
      c1emon.xikeos.xikeos_facts:
        gather_subset: "{{ switch_xikeos_gather_subset }}"
        gather_network_resources: "{{ switch_xikeos_gather_network_resources }}"
      register: switch_xikeos_facts_result  # noqa: var-naming[no-role-prefix]
      changed_when: false
      no_log: true

    - name: Expose collection-native switch facts  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        switch_native_facts: >-  # noqa: var-naming[no-role-prefix]
          {{ switch_xikeos_facts_result.ansible_facts | default({}) }}
        switch_network_resources: >-  # noqa: var-naming[no-role-prefix]
          {{ switch_xikeos_facts_result.ansible_facts.ansible_network_resources | default({}) }}
      no_log: true

    - name: Import switch read-only facts export workflow
      ansible.builtin.import_tasks: tasks/export-readonly-facts.yml
