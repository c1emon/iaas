---
- name: Additively manage OPNsense firewall aliases
  hosts: opnsense
  gather_facts: false
  connection: local

  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_api_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"

  vars:
    opnsense_alias_source: >-
      {{ lookup('ansible.builtin.env', 'ENVIRONMENT_DIR', default=undef()) }}/ansible/vars/opnsense/aliases.yml

  tasks:
    - name: Validate explicit activation recovery option before credential access
      ansible.builtin.assert:
        that:
          - opnsense_force_reload | default(false) is boolean
        fail_msg: opnsense_force_reload must be a YAML or JSON boolean
      changed_when: false

    - name: Validate desired OPNsense aliases locally
      ansible.builtin.command:
        argv:
          - uv
          - run
          - --no-sync
          - --directory
          - "{{ playbook_dir }}/../../../.."
          - python
          - -m
          - iaas_automation.opnsense_validation
          - --resource
          - aliases
          - --file
          - "{{ opnsense_alias_source }}"
      args:
        chdir: "{{ playbook_dir }}/../../../.."
      environment:
        PYTHONPATH: "{{ playbook_dir }}/../../../src"
      changed_when: false
      check_mode: false

    - name: Load desired OPNsense aliases
      ansible.builtin.include_vars:
        file: "{{ opnsense_alias_source }}"

    - name: Run OPNsense API credential preflight
      ansible.builtin.import_tasks: tasks/api-credential-preflight.yml

    - name: Assert desired aliases use alias_multi-compatible fields
      ansible.builtin.assert:
        that:
          - opnsense_aliases is defined
          - opnsense_aliases is sequence
          - opnsense_aliases | rejectattr('name', 'defined') | list | length == 0
          - opnsense_aliases | rejectattr('type', 'defined') | list | length == 0
          - opnsense_aliases | rejectattr('content', 'defined') | list | length == 0
          - opnsense_aliases | rejectattr('description', 'defined') | list | length == 0
          - opnsense_aliases | rejectattr('enabled', 'defined') | list | length == 0
          - opnsense_aliases | rejectattr('state', 'defined') | list | length == 0
        fail_msg: >-
          Each desired alias must define name, type, content, description,
          enabled, and state fields compatible with oxlorg.opnsense.alias_multi.

    - name: Read existing alias definitions before any write
      oxlorg.opnsense.list:
        target: alias
      register: opnsense_alias_live
      changed_when: false
      no_log: true

    - name: Validate the effective graph and plan dependency batches
      ansible.builtin.set_fact:
        opnsense_alias_plan_result: "{{ opnsense_aliases | opnsense_alias_plan(opnsense_alias_live.data) }}"
        opnsense_alias_apply:
          changed: false
      no_log: true

    - name: Report admitted alias plan
      ansible.builtin.debug:
        msg:
          present: "{{ opnsense_alias_plan_result.present_count }}"
          removals: "{{ opnsense_alias_plan_result.removal_count }}"
          would_change: "{{ opnsense_alias_plan_result.would_change }}"

    - name: Report check-mode configuration difference
      ansible.builtin.set_fact:
        opnsense_alias_apply:
          changed: "{{ opnsense_alias_plan_result.would_change }}"
      changed_when: opnsense_alias_plan_result.would_change
      when: ansible_check_mode

    - name: Reconcile admitted alias batches in dependency order
      when: not ansible_check_mode
      block:
        - name: Apply one dependency batch at a time
          ansible.builtin.include_tasks: tasks/apply-alias-batch.yml
          loop: "{{ opnsense_alias_plan_result.batches }}"
          loop_control:
            loop_var: opnsense_alias_batch
            label: "{{ opnsense_alias_batch[0].name }}"
      rescue:
        - name: Report partial alias reconciliation
          ansible.builtin.fail:
            msg: >-
              OPNsense alias reconciliation failed. Some configuration may have been saved;
              later batches and activation were not attempted. No rollback was performed.
              Review and correct the cause, then rerun this target; use opnsense_force_reload=true
              as a JSON/YAML boolean when activation recovery is required.

    - name: Reload OPNsense alias target after alias changes
      when:
        - not ansible_check_mode
        - (opnsense_alias_apply | default({})) is changed or opnsense_force_reload | default(false)
      block:
        - name: Activate saved alias configuration
          oxlorg.opnsense.reload:
            target: alias
        - name: Report activation success
          ansible.builtin.debug:
            msg: "OPNsense alias: reconciliation succeeded; activation succeeded"
      rescue:
        - name: Report saved configuration and failed activation
          ansible.builtin.fail:
            msg: >-
              OPNsense alias: reconciliation succeeded but activation failed;
              saved configuration may differ from active configuration. Review the
              appliance, then retry the same target with opnsense_force_reload=true
              as a JSON/YAML boolean. No rollback was performed.
