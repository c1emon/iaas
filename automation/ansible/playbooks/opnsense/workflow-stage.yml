---
- name: Execute one reviewed OPNsense workflow stage
  hosts: opnsense
  gather_facts: false
  connection: local

  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_api_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"

  vars:
    opnsense_workflow_activation_targets:
      aliases: {module: firewall, controller: alias, command: reconfigure}
      vips: {module: interfaces, controller: vip_settings, command: reconfigure}
      gateways: {module: routing, controller: settings, command: reconfigure}
      filter-rules: {module: firewall, controller: filter, command: apply}
      dnat: {module: firewall, controller: d_nat, command: apply}
      one-to-one-nat: {module: firewall, controller: one_to_one, command: apply}
      interface-groups: {module: firewall, controller: group, command: reconfigure}

  tasks:
    - name: Validate workflow stage selector before credentials
      ansible.builtin.assert:
        that:
          - opnsense_workflow_resource is defined
          - >-
            opnsense_workflow_resource in ['aliases', 'vips', 'gateways', 'filter-rules', 'dnat',
            'one-to-one-nat', 'interface-groups']
          - opnsense_workflow_action | default('save') in ['save', 'activate']
        fail_msg: >-
          workflow stage requires one supported resource and action save or activate.
      changed_when: false

    - name: Admit and load selected workflow records before credentials
      ansible.builtin.include_tasks: tasks/workflow-stage-admission.yml
      when: opnsense_workflow_action | default('save') == 'save'

    - name: Save the selected resource configuration without activation
      ansible.builtin.include_tasks: tasks/workflow-stage-save.yml
      when: opnsense_workflow_action | default('save') == 'save'

    - name: Activate the selected fixed native target
      ansible.builtin.assert:
        that:
          - opnsense_workflow_resource | opnsense_provider_readiness
        fail_msg: the selected fixed OPNsense provider is unavailable or not pinned.
      when:
        - opnsense_workflow_action | default('save') == 'activate'
        - opnsense_workflow_resource in ['dnat', 'one-to-one-nat', 'interface-groups']
      changed_when: false

    - name: Validate activation result destination before credentials
      ansible.builtin.assert:
        that:
          - opnsense_workflow_result_path is defined
          - opnsense_workflow_result_path | length > 0
        fail_msg: workflow activation stage requires a protected result path.
      when: opnsense_workflow_action | default('save') == 'activate'
      changed_when: false

    - name: Run API credential preflight for activation
      ansible.builtin.import_tasks: tasks/api-credential-preflight.yml
      when: opnsense_workflow_action | default('save') == 'activate'

    - name: Execute the selected fixed native target
      ansible.builtin.include_tasks: tasks/workflow-stage-activate.yml
      when: opnsense_workflow_action | default('save') == 'activate'
