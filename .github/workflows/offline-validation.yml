name: offline-validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.27.2
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - run: uv sync --locked --dev

      - run: uv run ansible-galaxy collection install -r automation/ansible/requirements.yml -p automation/ansible/collections

      - run: make check ENVIRONMENT_DIR="$PWD/environments/astra" OUTPUT_DIR="$RUNNER_TEMP/iaas-output" GENERATED_DIR="$PWD/environments/astra/generated" PVE_DIR="$PWD/environments/astra/opentofu/pve"

      - run: make secret-scan
