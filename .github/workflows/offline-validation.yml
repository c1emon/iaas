name: offline-validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - run: uv sync --locked --dev

      - run: make check
