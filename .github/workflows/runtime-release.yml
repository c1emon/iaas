name: runtime-release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: runtime-release-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  launcher:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build versioned launcher assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: sh automation/launcher/build.sh "$RUNNER_TEMP/iaas-launcher" "$RELEASE_TAG"
      - name: Attach launcher assets without replacing existing files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/iaas-launcher/* --repo "$GITHUB_REPOSITORY"

  build:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            gitleaks_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            gitleaks_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUNTIME_BUILD_CACHE_DIR: /tmp/iaas-build-cache
      RUNTIME_PLATFORM: linux/${{ matrix.arch }}
      RUNTIME_IMAGE: iaas-runtime:release-tested-${{ matrix.arch }}
      GITLEAKS_ARCH: ${{ matrix.gitleaks_arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.9"
          python-version: "3.12"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.12.6"
      - name: Validate event and exact source
        run: uv run python automation/runtime/release.py prepare
      - run: uv sync --locked --dev
      - run: uv run ansible-galaxy collection install --no-deps -r automation/runtime/collections.yml -p automation/ansible/collections
      - name: Install checkout secret scanner
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_${GITLEAKS_ARCH}.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - run: make check ENVIRONMENT_DIR="$PWD/tests/fixtures/environment" OUTPUT_DIR="$RUNNER_TEMP/iaas-output" GENERATED_DIR="$PWD/tests/fixtures/environment/generated" PVE_DIR="$PWD/tests/fixtures/environment/opentofu"
      - run: make secret-scan
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/iaas-build-cache
          key: iaas-runtime-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'automation/runtime/Dockerfile', 'automation/runtime/collections.yml', 'automation/runtime/prune.py') }}
          restore-keys: iaas-runtime-${{ matrix.arch }}-
      - name: Set up the release Docker baseline
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - run: docker buildx create --use
      - name: Build versioned image
        run: |
          export OCI_SOURCE="$(jq -r .source release.json)"
          export OCI_REVISION="$(jq -r .revision release.json)"
          export OCI_VERSION="$(jq -r .tag release.json)"
          make runtime-build RUNTIME_IMAGE="$RUNTIME_IMAGE"
      - run: make runtime-tofu-check RUNTIME_IMAGE="$RUNTIME_IMAGE"
      - run: uv run python automation/runtime/inspect_image.py --image "$RUNTIME_IMAGE"
      - name: Save the tested image without rebuilding
        run: |
          docker image inspect "$RUNTIME_IMAGE" --format '{{.Id}}' > image-id.txt
          docker save -o runtime-image.tar "$RUNTIME_IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-runtime-${{ matrix.arch }}
          path: |
            runtime-image.tar
            image-id.txt
            release.json
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.9"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tested-runtime-*
          path: tested-images
      - name: Set up the release Docker baseline
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.5.2
          # Keep this daemon selected when publication replaces DOCKER_CONFIG.
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Load and check tested image identity
        run: |
          for arch in amd64 arm64; do
            artifact="tested-images/tested-runtime-$arch"
            docker load -i "$artifact/runtime-image.tar"
            test "$(docker image inspect "iaas-runtime:release-tested-$arch" --format '{{.Id}}')" = "$(cat "$artifact/image-id.txt")"
          done
          cmp tested-images/tested-runtime-amd64/release.json tested-images/tested-runtime-arm64/release.json
          cp tested-images/tested-runtime-amd64/release.json release.json
      - name: Publish without overwriting an existing version
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-project python automation/runtime/release.py publish

  anonymous-consumption:
    needs: publish
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up the release Docker baseline
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.5.2
          # Anonymous authentication isolation must not change the daemon.
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Clean anonymous digest pull and invocation
        shell: bash
        env:
          RUNTIME_PLATFORM: linux/${{ matrix.arch }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          if docker pull --platform "$RUNTIME_PLATFORM" "$IMAGE_DIGEST" &&
             docker run --rm --platform "$RUNTIME_PLATFORM" --network none "$IMAGE_DIGEST" capabilities | jq -e --arg platform "$RUNTIME_PLATFORM" '.platforms == [$platform]'; then
            echo "Anonymous consumption succeeded: \`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Publication succeeded, but public consumption failed. Check package visibility; do not report distribution success.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
